<html>
    <head>
        <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    </head>

    <body>
        <a-scene>
            <a-assets>
                <img id="background" src="assets/linebackground.png">
            </a-assets>

            <a-entity position="0 -2 -3">
                <a-box width="3" position="0 5 7.3" depth="3"></a-box>
                <a-cylinder rotation="-30 0 0" position="0 10 3" radius="0.5" height="10"></a-cylinder>
                <a-entity position="0 9.7 -8" animation="property: rotation; to: 55 0 0 dur: 200; delay: 100; loop: true; dir: alternate;">
                    <a-box width="3" depth="3"></a-box>
                    <a-cylinder position="0 4.7 0" radius="0.5" height="10"></a-cylinder>
                    <a-sphere position="0 8 3"></a-sphere>
                    
                </a-entity>
            </a-entity>


        


            <a-sky src="background"> </a-sky>
        </a-scene>
    </body>
</html>
